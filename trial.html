<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Upload</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      padding: 20px;
      max-width: 600px;
    }
    .upload-box {
      border: 2px dashed #ccc;
      padding: 20px;
      text-align: center;
    }
    .upload-box:hover {
      border-color: #007bff;
    }
    input[type="file"] {
      margin: 20px 0;
    }
    button {
      padding: 10px 20px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <h1>Upload Your File</h1>
  <div class="upload-box">
    <form id="fileUploadForm">
      <label for="fileInput">Select a file:</label>
      <input type="file" id="fileInput" name="file" required>
      <br>
      <button type="submit">Upload</button>
    </form>
  </div>

  <p id="statusMessage"></p>

  <script>
    // Listen for form submission
    document.getElementById('fileUploadForm').addEventListener('submit', async (event) => {
      event.preventDefault(); // Prevent the form from refreshing the page

      const fileInput = document.getElementById('fileInput');
      const file = fileInput.files[0];

      if (!file) {
        alert('Please select a file first.');
        return;
      }

      // Create FormData to send the file
      const formData = new FormData();
      formData.append('file', file);
      
      const maxSize = 10 * 1024 * 1024

      if(file.size > maxSize){
        alert(`this file is too big`)
        return
      }

    //   Send the file to the backend using Fetch API
      try {
        const response = await fetch('http://localhost:3000/upload', { // Replace with your backend URL
          method: 'POST',
          body: formData,
        });

        const result = await response.json();
        if (response.ok) {
          document.getElementById('statusMessage').textContent = `File uploaded successfully! File URL: ${result.publicUrl}`;
        } else {
          throw new Error(result.message || 'File upload failed.');
        }
      } catch (error) {
        document.getElementById('statusMessage').textContent = `Error: ${error.message}`;
      }
    });
  </script>
</body>
</html>
